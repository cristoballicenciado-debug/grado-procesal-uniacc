<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuestionario de Derecho Procesal – Grado UNIACC</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;color:#18212b;margin:0}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px #0001}.top{display:flex;justify-content:space-between;color:#687381;font-size:14px}.bar{height:7px;background:#e2e6eb;border-radius:8px;overflow:hidden;margin:12px 0 22px}.bar i{display:block;height:100%;background:#294c7a;width:0}.q{font-size:21px;line-height:1.4;margin:0 0 20px}.opt{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;border:1px solid #ccd3db;border-radius:10px;background:#fff;cursor:pointer;font-size:16px}.opt:hover{border-color:#294c7a}.opt.ok{background:#e5f5ec;border-color:#20814f}.opt.bad{background:#fde9e6;border-color:#b83c2d}.btn{border:0;border-radius:10px;background:#294c7a;color:#fff;padding:13px 20px;font-size:16px;cursor:pointer;margin-top:14px}.feedback{margin-top:18px;padding:14px;border-left:4px solid #294c7a;background:#f1f4f8}.score{font-size:42px;font-weight:bold}.small{color:#687381}.hidden{display:none}.start h1{margin-top:0}.result li{margin:12px 0}.brand{font-weight:bold;letter-spacing:.3px}</style></head><body><div class="wrap"><div id="app"></div></div><script>
const Q=[
['Jurisdicción','Según el artículo 76 de la Constitución, la facultad de conocer las causas civiles y criminales, juzgarlas y hacer ejecutar lo juzgado corresponde a:',['El Poder Ejecutivo','Los tribunales establecidos por la ley','El Congreso Nacional','La Contraloría General de la República'],1,'La jurisdicción corresponde exclusivamente a los tribunales establecidos por la ley.'],
['Acción','La acción procesal se entiende principalmente como:',['El derecho material discutido','La facultad de exigir tutela jurisdiccional del Estado','La sentencia definitiva','La obligación de contestar la demanda'],1,'La acción es un derecho público subjetivo dirigido a obtener tutela jurisdiccional.'],
['Pretensión','¿Qué diferencia a la pretensión de la acción?',['La pretensión es lo que se pide frente a otro; la acción provoca la actividad jurisdiccional','La pretensión solo existe en materia penal','La acción y la pretensión son siempre sinónimos','La pretensión es una resolución judicial'],0,'La pretensión es el contenido concreto de lo que se reclama frente a otra parte.'],
['Proceso','El proceso puede definirse como:',['Una sola resolución judicial','La secuencia jurídicamente ordenada de actos destinada a resolver una controversia','Solo la etapa probatoria','Una actuación exclusiva del demandado'],1,'El proceso es una secuencia de actos procesales orientada a la solución jurisdiccional del conflicto.'],
['Principios formativos del procedimiento','El principio dispositivo supone, como regla general, que:',['El juez siempre inicia de oficio','Las partes tienen iniciativa para iniciar y delimitar el objeto del proceso','El juez nunca puede adoptar ninguna medida','La prueba siempre la produce exclusivamente el tribunal'],1,'En el proceso civil chileno existe una importante vigencia del principio dispositivo, aunque con atenuaciones legales.'],
['Organización y estructura de los tribunales','¿Cuál es una función característica de la Corte Suprema?',['Conocer todos los asuntos como tribunal de primera instancia','Ejercer la superintendencia directiva, correccional y económica de los tribunales','Dictar leyes','Representar judicialmente al Estado en todos los procesos'],1,'La Constitución entrega a la Corte Suprema la superintendencia señalada, con las excepciones legales.'],
['Tribunales ordinarios, especiales y arbitrales','¿Cuál es la clasificación correcta?',['Los tribunales ordinarios ejercen jurisdicción en materias comunes; los especiales conocen materias determinadas y los árbitros ejercen jurisdicción arbitral','Los árbitros son siempre órganos administrativos','Los tribunales especiales carecen de jurisdicción','Los tribunales ordinarios solo conocen asuntos penales'],0,'La clasificación atiende a la extensión y materia de la jurisdicción y al carácter arbitral del órgano.'],
['Competencia absoluta','¿Cuál de estos elementos pertenece principalmente a la competencia absoluta?',['Territorio','Cuantía, materia y fuero','Domicilio elegido por las partes','Lugar de notificación'],1,'La competencia absoluta se determina, entre otros factores, por cuantía, materia y fuero.'],
['Competencia relativa','La competencia relativa se relaciona principalmente con:',['El territorio','La jerarquía constitucional','La nacionalidad del juez','La existencia de un recurso'],0,'La competencia relativa distribuye asuntos entre tribunales competentes atendiendo principalmente al territorio.'],
['Reglas generales de competencia','La regla de la radicación significa que:',['Una causa puede cambiar de tribunal libremente','Radicado un asunto ante tribunal competente, su competencia no se altera por causas sobrevinientes','El tribunal siempre pierde competencia al cambiar el domicilio','Solo se aplica a tribunales arbitrales'],1,'El artículo 109 del COT consagra la radicación o fijeza.'],
['Prórroga de competencia','La prórroga tácita de competencia relativa por el demandante se produce, en general, cuando:',['Presenta la demanda ante el tribunal','Rinde prueba','Solicita una medida precautoria en otro tribunal','Apela de la sentencia'],0,'El artículo 187 del COT vincula la prórroga tácita del demandante con la presentación de la demanda.'],
['Inhibitoria y declinatoria','La inhibitoria se plantea ante:',['El tribunal que actualmente conoce el asunto','El tribunal que se estima competente','La Corte Suprema en todos los casos','El tribunal superior de la causa'],1,'La inhibitoria se presenta ante el tribunal que se considera competente para que requiera al otro que se inhiba.'],
['Cuestiones y conflictos de competencia','Existe conflicto positivo de competencia cuando:',['Ningún tribunal quiere conocer','Dos o más tribunales se consideran competentes para conocer del mismo asunto','El demandado no comparece','Se interpone una apelación'],1,'El conflicto positivo supone que más de un tribunal afirma tener competencia.'],
['Implicancias y recusaciones','En términos generales, las implicancias y recusaciones tienen por finalidad:',['Aumentar la cuantía del juicio','Inhabilitar al juez que se encuentra afectado por una causal legal','Suspender siempre la sentencia','Cambiar automáticamente la materia del proceso'],1,'Son mecanismos destinados a resguardar la imparcialidad del órgano jurisdiccional.'],
['Partes y capacidad procesal','La capacidad procesal se refiere a:',['La aptitud para comparecer y actuar válidamente en juicio','La competencia territorial del tribunal','La cuantía de la demanda','La capacidad económica para pagar costas'],0,'La capacidad procesal es la aptitud para realizar válidamente actos procesales.'],
['Comparecencia en juicio','La comparecencia en juicio se relaciona con:',['La forma en que las partes intervienen válidamente ante el tribunal','La competencia absoluta','La cosa juzgada','La ejecución administrativa'],0,'Comparecer supone intervenir procesalmente ante el órgano jurisdiccional conforme a las reglas legales.'],
['Patrocinio y poder','El patrocinio tiene por objeto principal:',['La representación patrimonial automática','La defensa técnica de los derechos en juicio','La notificación personal','La determinación de la cuantía'],1,'El patrocinio se refiere a la defensa técnica por abogado habilitado.'],
['Terceros','El tercero coadyuvante es quien:',['Pretende un derecho incompatible con ambas partes','Tiene interés actual en el resultado y se adhiere a una de las partes','Reemplaza siempre al demandado','Actúa exclusivamente como testigo'],1,'El artículo 23 CPC contempla al tercero coadyuvante como quien tiene interés actual y coadyuva con una parte.'],
['Pluralidad de partes','Hay litisconsorcio cuando:',['Existe pluralidad de sujetos que actúan como partes en un mismo proceso','Solo existe un demandado','El juez dicta dos sentencias','El proceso es siempre arbitral'],0,'El litisconsorcio supone pluralidad de partes en una misma relación procesal.'],
['Actos procesales','Los actos procesales son:',['Actuaciones realizadas dentro del proceso con relevancia jurídica procesal','Solo las sentencias','Únicamente los actos del juez','Actos privados sin efectos jurídicos'],0,'Son actuaciones procesales realizadas por tribunal, partes u otros intervinientes con efectos jurídicos en el proceso.'],
['Plazos','Según la regla general del artículo 64 CPC, los plazos establecidos por el Código son:',['Siempre prorrogables','Fatales, salvo las excepciones legales','Meramente orientativos','Siempre suspendidos los fines de semana'],1,'Los plazos establecidos por el CPC son, por regla general, fatales.'],
['Resoluciones judiciales','La resolución que falla un incidente estableciendo derechos permanentes para las partes es:',['Decreto','Auto','Sentencia interlocutoria','Sentencia definitiva'],2,'El artículo 158 CPC define como sentencia interlocutoria aquella que falla un incidente estableciendo derechos permanentes.'],
['Notificaciones','La primera notificación de una resolución a una persona debe efectuarse, por regla general:',['Por estado diario','Personalmente','Por teléfono','Por correo simple'],1,'La primera notificación debe ser personal, salvo las excepciones legales.'],
['Emplazamiento','El emplazamiento comprende esencialmente:',['Solo la notificación de la sentencia','La notificación legal de la demanda y el transcurso del plazo para defenderse','La recepción de la causa a prueba','La conciliación obligatoria'],1,'El emplazamiento asegura que el demandado conozca la demanda y disponga del plazo legal para defenderse.'],
['Incidentes','Un incidente es:',['Una cuestión accesoria al juicio que requiere pronunciamiento especial del tribunal','Siempre una demanda nueva','Una sentencia definitiva','Un recurso extraordinario'],0,'Los incidentes son cuestiones accesorias relacionadas con el juicio que requieren resolución especial.'],
['Nulidad procesal','Para que proceda la nulidad procesal debe existir, entre otros elementos:',['Solo un error formal sin perjuicio','Un vicio procesal que cause perjuicio reparable mediante la nulidad y no esté convalidado','Siempre una sentencia definitiva','Únicamente una infracción penal'],1,'La nulidad procesal exige perjuicio y los demás presupuestos legales, además de respetar las reglas de oportunidad y convalidación.'],
['Formación y custodia del expediente','La formación y custodia del expediente tiene como finalidad principal:',['Asegurar la conservación y disponibilidad de las actuaciones procesales','Eliminar las resoluciones antiguas','Impedir el acceso de las partes en todos los casos','Reemplazar las audiencias'],0,'El expediente permite conservar y ordenar las actuaciones que integran el proceso, bajo las reglas legales aplicables.'],
['Comunicaciones procesales','El exhorto es:',['Un recurso contra una sentencia','Una comunicación de un tribunal a otro para practicar una diligencia','Una sentencia interlocutoria','Una medida precautoria'],1,'El exhorto permite que un tribunal solicite a otro la práctica de una diligencia fuera de su territorio.'],
['Medidas prejudiciales','Concedida una medida prejudicial, la demanda debe presentarse, como regla del artículo 280 CPC, dentro de:',['3 días','5 días','10 días','30 días siempre'],2,'El artículo 280 CPC establece 10 días, ampliables hasta 30 por motivos fundados.'],
['Medidas precautorias','Para decretar una medida precautoria del CPC, el solicitante debe acompañar antecedentes que constituyan:',['Presunción grave del derecho que se reclama','Sentencia definitiva ejecutoriada en todos los casos','Confesión del demandado','Informe de Carabineros'],0,'El artículo 298 CPC exige antecedentes que constituyan presunción grave del derecho que se reclama.'],
['Demanda','Entre los requisitos del artículo 254 CPC se encuentra:',['La designación del tribunal ante el que se entabla','La lista definitiva de testigos','La sentencia que se solicita ejecutar','La aceptación expresa del demandado'],0,'La demanda debe cumplir los requisitos formales del artículo 254 CPC, entre ellos designar el tribunal y exponer hechos, fundamentos y peticiones.'],
['Contestación de la demanda','La contestación de la demanda tiene por finalidad principal:',['Responder las pretensiones del actor, formulando alegaciones y defensas','Iniciar necesariamente otro proceso','Dictar sentencia','Designar al juez'],0,'La contestación permite al demandado oponer sus defensas y fijar su posición frente a la demanda.'],
['Reconvención','En el juicio ordinario, la reconvención debe formularse:',['En la réplica','Al contestar la demanda','En la dúplica','Durante el término probatorio'],1,'El artículo 314 CPC exige que la reconvención se deduzca al contestar la demanda.'],
['Excepciones dilatorias','¿Cuál es una excepción dilatoria?',['Pago','Prescripción','Litis pendencia','Compensación'],2,'La litis pendencia es una excepción dilatoria contemplada en el artículo 303 CPC.'],
['Excepciones perentorias','Las excepciones perentorias tienen por objeto principal:',['Corregir un defecto formal del procedimiento','Destruir o enervar la pretensión del actor atacando su fundamento','Cambiar al juez','Suspender siempre el juicio'],1,'Las perentorias buscan impedir que prospere la pretensión, atacando su fundamento o extinguiendo el derecho alegado.'],
['Alegaciones y defensa','Las alegaciones y defensas del demandado se orientan principalmente a:',['Sostener las razones de hecho y derecho por las que la pretensión no debe prosperar','Impedir toda actividad probatoria','Reemplazar la sentencia','Determinar la competencia absoluta después de la sentencia'],0,'Las alegaciones y defensas permiten al demandado controvertir los hechos y fundamentos jurídicos de la pretensión.']
];
let i=0,score=0,wrong=[];const app=document.getElementById('app');function start(){render()}function render(){if(i>=Q.length)return finish();let q=Q[i];app.innerHTML=`<div class="card"><div class="brand">GRADO DERECHO · UNIACC</div><div class="top"><span>Pregunta ${i+1} de ${Q.length}</span><span>Aciertos: ${score}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="small">Materia: ${q[0]}</div><p class="q">${q[1]}</p><div id="opts"></div><div id="fb"></div></div>`;q[2].forEach((x,k)=>{let b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>pick(k);document.getElementById('opts').appendChild(b)})}function pick(k){let q=Q[i],bs=document.querySelectorAll('.opt'),ok=k===q[3];bs.forEach((b,n)=>{b.disabled=true;if(n===q[3])b.classList.add('ok');if(n===k&&!ok)b.classList.add('bad')});if(ok)score++;else wrong.push(i);document.getElementById('fb').innerHTML=`<div class="feedback"><b>${ok?'Respuesta correcta':'Respuesta incorrecta'}</b><br>${q[4]}</div><button class="btn" id="next">${i===Q.length-1?'Ver resultado':'Siguiente'}</button>`;document.getElementById('next').onclick=()=>{i++;render()}}function finish(){let pct=Math.round(score/Q.length*100);let h=`<div class="card"><div class="brand">RESULTADO · DERECHO PROCESAL UNIACC</div><p class="score">${score}/${Q.length}</p><p>${pct}% de respuestas correctas.</p>`;if(wrong.length){h+='<h3>Materias para repasar</h3><ol class="result">';wrong.forEach(n=>h+=`<li><b>${Q[n][0]}</b><br>${Q[n][1]}<br><span class="small">Respuesta correcta: ${Q[n][2][Q[n][3]]}</span></li>`);h+='</ol>'}else h+='<p>Excelente: no registraste errores.</p>';h+='<button class="btn" onclick="location.reload()">Reintentar</button></div>';app.innerHTML=h}app.innerHTML=`<div class="card start"><div class="brand">GRADO DERECHO · UNIACC</div><h1>Cuestionario de Derecho Procesal</h1><p>36 preguntas sobre el temario indicado: jurisdicción, acción, pretensión, proceso, competencia, partes, actos procesales, notificaciones, medidas, demanda, excepciones y defensa.</p><p class="small">Las respuestas se corrigen al finalizar cada pregunta y el resultado queda visible al terminar.</p><button class="btn" onclick="start()">Comenzar cuestionario</button></div>`;
</script></body></html>
